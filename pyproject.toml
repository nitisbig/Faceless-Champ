[project]
name = "faceless-champ"
version = "0.1.5"
description = "Programmatic animated video editing for developers and AI agents"
readme = "README.md"
authors = [
    { name = "Nitesh Ghimire", email = "niteshghimire223@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.4,<13",
    "pyvista>=0.49.1",
]

[project.optional-dependencies]
skia = ["skia-python>=144.0.post2,<145", "numpy>=1.26,<3"]
chess = ["chess>=1.11.2,<2"]
coding = ["Pygments>=2.18,<3"]
playground = ["Pygments>=2.18,<3", "playwright>=1.58,<2"]
web = ["playwright>=1.58,<2"]
maps = ["numpy>=1.26,<3"]
equations = ["matplotlib>=3.9,<4"]

[project.scripts]
faceless-champ = "faceless_champ:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.uv.build-backend]
source-include = ["docs/**", "examples/**", "tests/**", "skills/**", "llms.txt", "uv.lock", "scripts/prepare_maps.py", "scripts/benchmark_flowchamp.py", "scripts/benchmark_renderers.py", "docker/**"]
