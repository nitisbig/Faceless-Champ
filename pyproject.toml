[project]
name = "faceless-champ"
version = "2.0.0rc1"
description = "Programmatic animated video editing for developers and AI agents"
readme = "README.md"
authors = [
    { name = "Nitesh Ghimire", email = "niteshghimire223@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.4,<13",
]

[project.optional-dependencies]
3d = ["pyvista>=0.49.1,<0.50"]
cad = ["pyvista>=0.49.1,<0.50", "build123d>=0.13,<0.14; python_version < '3.15'"]
geometry = ["pyvista>=0.49.1,<0.50", "trimesh>=5.1.1,<6", "scipy>=1.16,<2", "networkx>=3,<4"]
geometry-advanced = ["pyvista>=0.49.1,<0.50", "trimesh>=5.1.1,<6", "scipy>=1.16,<2", "networkx>=3,<4", "manifold3d>=3.5.4,<4", "fast-simplification>=0.2,<0.3"]
gpu = ["moderngl>=5.13,<6", "glcontext>=3.1,<4", "numpy>=1.26,<3"]
effects = ["numpy>=1.26,<3"]
skia = ["skia-python>=144.0.post2,<145", "numpy>=1.26,<3"]
equations = ["matplotlib>=3.9,<4"]

[project.scripts]
faceless-champ = "faceless_champ:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.uv.build-backend]
source-include = ["docs/**", "examples/**", "tests/**", "skills/**", "llms.txt", "uv.lock", "scripts/prepare_maps.py", "scripts/sync_reference_docs.py", "scripts/benchmark_flowchamp.py", "scripts/benchmark_renderers.py", "scripts/benchmark_compilation.py", "scripts/benchmark_geometry.py", "scripts/probe_geometry.py", "docker/**"]
