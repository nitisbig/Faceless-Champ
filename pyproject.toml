[project]
name = "faceless-champ"
version = "0.1.2"
description = "Programmatic animated video editing for developers and AI agents"
readme = "README.md"
authors = [
    { name = "Nitesh Ghimire", email = "niteshghimire223@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["Pillow>=10.4,<13"]

[project.optional-dependencies]
coding = ["Pygments>=2.18,<3"]
web = ["playwright>=1.58,<2"]
maps = ["numpy>=1.26,<3"]
equations = ["matplotlib>=3.9,<4"]

[project.scripts]
faceless-champ = "faceless_champ:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.uv.build-backend]
source-include = ["docs/**", "examples/**", "tests/**", "skills/**", "llms.txt", "uv.lock", "scripts/prepare_maps.py"]
