[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facelesschamp-agent"
version = "2.0.0rc1"
description = "Planning, discovery, and evidence-based video production tools for external agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["facelesschamp-kit>=2.0.0rc1,<3.0.0", "pydantic>=2,<3"]

[project.optional-dependencies]
coding = ["facelesschamp-kit[coding]>=2.0.0rc1,<3.0.0"]
playground = ["facelesschamp-kit[playground]>=2.0.0rc1,<3.0.0"]
web = ["facelesschamp-kit[web]>=2.0.0rc1,<3.0.0"]
maps = ["facelesschamp-kit[maps]>=2.0.0rc1,<3.0.0"]
3d = ["facelesschamp-kit[3d]>=2.0.0rc1,<3.0.0"]
cad = ["facelesschamp-kit[cad]>=2.0.0rc1,<3.0.0"]
geometry = ["facelesschamp-kit[geometry]>=2.0.0rc1,<3.0.0"]
geometry-advanced = ["facelesschamp-kit[geometry-advanced]>=2.0.0rc1,<3.0.0"]
gpu = ["facelesschamp-kit[gpu]>=2.0.0rc1,<3.0.0"]
effects = ["facelesschamp-kit[effects]>=2.0.0rc1,<3.0.0"]
skia = ["facelesschamp-kit[skia]>=2.0.0rc1,<3.0.0"]
equations = ["facelesschamp-kit[equations]>=2.0.0rc1,<3.0.0"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1"]

[project.scripts]
fc-agent = "facelesschamp_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facelesschamp_agent = ["resources/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
