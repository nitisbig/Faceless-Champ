[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facelesschamp-agent"
version = "0.1.0rc2"
description = "Planning, discovery, and evidence-based video production tools for external agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["facelesschamp-kit>=0.1.0rc7,<0.2.0", "pydantic>=2,<3"]

[project.optional-dependencies]
gpu = ["facelesschamp-kit[gpu]>=0.1.0rc7,<0.2.0"]
effects = ["facelesschamp-kit[effects]>=0.1.0rc7,<0.2.0"]
skia = ["facelesschamp-kit[skia]>=0.1.0rc7,<0.2.0"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1"]

[project.scripts]
fc-agent = "facelesschamp_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facelesschamp_agent = ["resources/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
